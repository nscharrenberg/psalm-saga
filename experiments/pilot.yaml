# Pilot: every condition on every example item, one generator, judged by a different model family.
# Inputs are resolved relative to this file; output relative to the working directory.
name: pilot
output: experiments_out/pilot
inputs:
  - {glob: "../examples/*.md", kind: premise}   # replace with source texts: {glob: "../corpus/nl/*.txt", kind: source}
conditions:
  full:        {preset: full}
  no_review:   {preset: no_review}
  no_spec:     {preset: no_spec}
  flat:        {preset: flat}
  paraphrase:  {preset: paraphrase}            # source inputs only
  # agents_room: {preset: agents_room}
models:
  sonnet:  {models.default.name: anthropic/claude-sonnet-5-5}
  # mistral: {models.default.name: mistral/mistral-large-latest}
  # kimi:    {models.default.name: moonshot/kimi-k2-0905-preview}
repeats: 1
concurrency: 2
overrides:
  limits.max_cost_usd: 3
judge:
  model: openai/gpt-5.5
  instruments: [spec_recovery, quality_pairwise]
  quality_baseline: flat
