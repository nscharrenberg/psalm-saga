<header><h1>PSALM<span>·</span>SAGA</h1><p>Synthetic counterparts of literary texts: the same research-relevant properties, new wording.</p><span class="grow"></span><button class="small nobusy" onclick="showKeys()" title="API keys and endpoints for the model providers">API keys</button><button class="small nobusy" onclick="helpFor('glossary')">Help &amp; glossary</button></header>
<aside>
  <button class="primary" style="width:100%" onclick="showNew()">+ New run</button>
  <div class="runs" id="runs" style="margin-top:12px"></div>
  <div id="exps" style="margin-top:18px"></div>
</aside>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Busy feedback: the button that was clicked shows a spinner until the requests it started have
// settled, and a thin bar at the top shows that the server is working.
let BUSY_BTN=null, INFLIGHT=0, BUSY_CLEAR=null, NET_T=null;
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button");
  if(b && !b.disabled && !b.closest(".tabs") && !b.classList.contains("nobusy")){ if(BUSY_BTN && BUSY_BTN!==b) BUSY_BTN.classList.remove("busy"); BUSY_BTN=b; clearTimeout(BUSY_CLEAR); BUSY_CLEAR=setTimeout(settle, 400); } }, true);
function settle(){ if(INFLIGHT>0) return; clearTimeout(BUSY_CLEAR); BUSY_CLEAR=setTimeout(()=>{ if(INFLIGHT===0 && BUSY_BTN){ BUSY_BTN.classList.remove("busy"); BUSY_BTN=null; } }, 250); }
function netStart(slow){ INFLIGHT++; if(BUSY_BTN && document.contains(BUSY_BTN)) BUSY_BTN.classList.add("busy");
  if(slow){ clearTimeout(NET_T); NET_T=setTimeout(()=>{ const b=$("#netbar"); if(b) b.classList.add("on"); }, 250); } }
function netEnd(){ INFLIGHT=Math.max(0,INFLIGHT-1); if(INFLIGHT===0){ clearTimeout(NET_T); const b=$("#netbar"); if(b) b.classList.remove("on"); settle(); } }
const api = async (path, opt={}) => {
  const slow = (opt.method||"GET")!=="GET";
  netStart(slow);
  try { const r = await fetch(path, opt); if(!r.ok){ let m=r.statusText; try{m=(await r.json()).detail||m}catch{}; throw new Error(m)} const ct=r.headers.get("content-type")||""; return ct.includes("json")? await r.json() : await r.text(); }
  finally { netEnd(); }
};
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 2600); };
let META=null, CUR=null, TAB="story", ES=null, EVENTS=[];

// ------------------------------------------------------------------ help
// All explanatory text comes from the server (psalm_saga/web/help.py and eval/grading.py via /api/meta).
const H = () => (META && META.help) || {};
const stageTitle = s => ((H().stages||{})[s]||{}).title || s;
const presetTitle = p => ((H().presets||{})[p]||{}).title || p;
function modal(title, html){
  closeModal();
  const d = document.createElement("div"); d.id = "modal";
  d.innerHTML = `<div class="box" role="dialog" aria-label="${esc(title)}"><button class="small close nobusy" onclick="closeModal()">Close</button><h2>${esc(title)}</h2>${html}</div>`;
  d.addEventListener("click", ev => { if(ev.target === d) closeModal(); });
  document.body.appendChild(d);
}
async function showKeys(){
  let k; try{ k = await api("/api/keys"); }catch(e){ toast(e.message); return; }
  const rows = k.providers.map(p=>`<details class="card" style="margin:6px 0;padding:10px 14px" ${p.ready?"":""}><summary><b>${esc(p.label)}</b> ${p.ready?'<span class="chip preserve">set</span>':'<span class="chip">not set</span>'} <span class="muted small">model ids like <code>${esc(p.example)}</code></span></summary>
      ${p.vars.map(v=>`<div class="row" style="margin-top:8px"><label style="margin:0;min-width:190px" class="mono">${esc(v.var)}</label>
        <input class="grow keyin" data-var="${esc(v.var)}" type="${v.kind==="key"?"password":"text"}" autocomplete="off" placeholder="${v.set?esc(v.display)+" ("+esc(v.source==="saved"?"saved here":"from the environment")+")":(v.kind==="url"?"https://…":v.kind==="key"?"paste the key":"")}" style="flex:1;max-width:none">
        <button class="small" onclick="saveKey('${esc(v.var)}')">Save</button>${v.source==="saved"?`<button class="small" onclick="saveKey('${esc(v.var)}', true)">Remove</button>`:""}</div>`).join("")}</details>`).join("");
  modal("API keys and endpoints", `<p>Models are called through LiteLLM; each provider needs its key (or, for self-hosted models, its address). Keys you save here are kept <b>on this computer only</b>, in <code>${esc(k.file)}</code>, and used for every run started here or with the <code>saga</code> command. They are never written into run folders or shown again in full. A key saved here takes precedence over one set as an environment variable.</p>
    <p class="muted small">Copyrighted input: sending in-copyright library material to an external API may not be allowed by your licences — for such runs use a model hosted inside the library (Ollama or vLLM).</p>${rows}`);
}
async function saveKey(v, remove){
  const inp = document.querySelector(`.keyin[data-var="${v}"]`); const value = remove ? "" : (inp ? inp.value.trim() : "");
  if(!remove && !value){ toast("Paste a value first."); return; }
  try{ await api("/api/keys", {method:"PUT", headers:{"content-type":"application/json"}, body:JSON.stringify({var:v, value})}); toast(remove?`${v} removed`:`${v} saved`); showKeys(); }
  catch(e){ toast(e.message); }
}
function closeModal(){ const m = $("#modal"); if(m) m.remove(); }
document.addEventListener("keydown", ev => { if(ev.key === "Escape") closeModal(); });
const info = (topic, key="") => `<button class="info nobusy" title="What is this?" onclick="event.stopPropagation();event.preventDefault();helpFor('${topic}','${esc(key)}')">i</button>`;
function helpFor(topic, key){
  const h = H();
  if(topic==="stage"){ const st = (h.stages||{})[key]||{};
    const u = ((window.ST||{}).usage||{}).by_stage||{}, t = (((window.ST||{}).timing||{}).stages||{})[key];
    const mine = CUR && (u[key] || t) ? `<dt>In this run</dt><dd>${u[key]?`${u[key].calls} model calls · $${(u[key].cost_usd||0).toFixed(3)}`:"no model calls"}${t?` · ${dur(t.wall_seconds)}`:""}</dd>` : "";
    return modal(st.title||key, `<p>${esc(st.what||"")}</p><dl><dt>Produces</dt><dd>${esc(st.produces||"")}</dd><dt>Model calls</dt><dd>${esc(st.calls||"")}</dd><dt>Internal name</dt><dd><code>${esc(key)}</code></dd>${mine}</dl><p class="muted small">The run's track shows each stage grey (not yet), orange (running) or green (done); faded stages do not apply to this kind of input. The activity tab shows every step in detail.</p>`); }
  if(topic==="preset"){ const p = (h.presets||{})[key]||{}, pr = (META.presets||[]).find(x=>x.name===key)||{};
    return modal(p.title||key, `<p>${esc(p.summary||pr.description||"")}</p><dl><dt>When to use</dt><dd>${esc(p.when||"")}</dd><dt>Stages</dt><dd>${Object.entries((pr.config||{}).stages||{}).filter(([,c])=>c.enabled).map(([s])=>esc(stageTitle(s))).join(" → ")}</dd><dt>Internal name</dt><dd><code>${esc(key)}</code></dd></dl><p class="muted small">${esc(pr.description||"")}</p>`); }
  if(topic==="policy"){ const P = h.policies||{}, ex = h.dimension_examples||{};
    const dims = META.taxonomy.dimensions;
    return modal("Transform policy: what carries over", `<p>For each of six dimensions of a narrative you decide what the synthetic text takes from the source. Names of characters and places are always replaced (unless you switch renaming off).</p>
      <dl>${Object.entries(P).map(([k,v])=>`<dt><b>${esc(v.title)}</b> <code>${k}</code></dt><dd>${esc(v.what)}</dd>`).join("")}</dl>
      <table><tr><th>dimension</th>${Object.values(P).map(v=>`<th>${esc(v.title)}</th>`).join("")}</tr>${dims.map(d=>`<tr><td><b>${esc(d.label)}</b><div class="muted small">${esc(d.description)}</div></td>${Object.keys(P).map(k=>`<td class="small">${esc((ex[d.key]||{})[k]||"")}</td>`).join("")}</tr>`).join("")}</table>
      <p class="muted small">Measures of a dimension that is replaced are not expected to match; the evaluation and the judges take the policy into account.</p>`); }
  if(topic==="dimension"){ const d = META.taxonomy.dimensions.find(x=>x.key===key)||{};
    return modal(d.label||key, `<p>${esc(d.description||"")}</p><table><tr><th>aspect</th><th>what it covers</th></tr>${(d.subdimensions||[]).map(sd=>`<tr><td>${esc(sd.label)}</td><td class="small">${esc(sd.guidance)}</td></tr>`).join("")}</table>`); }
  if(topic==="metric"){ return metricModal(key); }
  if(topic==="group"){ const g = META.evaluation.groups[key]||{};
    const ms = META.evaluation.metrics.filter(m=>m.group===key);
    return modal(g.title||key, `<p><b>${esc(g.question||"")}</b></p><p>${esc(g.why||"")}</p><table><tr><th>measure</th><th>what it measures</th></tr>${ms.map(m=>`<tr><td>${esc(m.label)}${m.core?'<span class="core">core</span>':""}</td><td class="small">${esc(m.meaning)}</td></tr>`).join("")}</table>`); }
  if(topic==="tab"){ return modal(key, `<p>${esc((h.tabs||{})[key]||"")}</p>`); }
  if(topic==="mode"){ return modal("Kind of input", `<dl>${Object.entries(h.modes||{}).map(([k,v])=>`<dt><code>${k}</code></dt><dd>${esc(v)}</dd>`).join("")}</dl>`); }
  if(topic==="scores"){ return modal("How to read the evaluation", `<p>Every measure is turned into a <b>score from 0 to 100%</b> where 100% is best, so all of them read the same way. The raw value (in its own unit) is shown underneath, and <i>how is this computed?</i> on each measure gives the formula.</p>
      <dl><dt><code>score = x</code></dt><dd>shares, similarities and recalls that already run from 0 (bad) to 1 (good)</dd>
      <dt><code>max(0, r)</code></dt><dd>correlations: a negative correlation counts as 0</dd>
      <dt><code>max(0, 1 − d / c)</code></dt><dd>differences and distances, where 0 means identical: <b>inverted</b>, so no difference gives 100% and a difference of c or more gives 0%</dd>
      <dt><code>max(0, 1 − |x − 1| / c)</code></dt><dd>ratios where 1 is ideal (length, variety)</dd></dl>
      <p><i class="good dot2"></i> green: score ≥ 80% · <i class="warn dot2"></i> orange: ≥ 60% · <i class="bad dot2"></i> red: below — unless a measure states other cut-offs. The cut-offs are provisional working values.</p>
      <p>Some measures are calibrated on the source itself: style allows for how much the source's two halves already differ, and graph measures are relative to how far a second analysis of the source agrees with the first. A measure that cannot be taken on this text (too few characters, no verse, …) is listed as not applicable rather than given a misleading number.</p>
      <p><span class="core">core</span> marks the compact set of measures used to compare conditions in experiments; the others are supporting detail.</p>`); }
  // glossary (default)
  const tabs = Object.entries(h.tabs||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  return modal("Help & glossary", `<p>PSALM·SAGA turns a literary text into a <b>synthetic counterpart</b>: a new text that keeps the properties researchers measure (style, structure, characters, …) but none of the original wording, so it can be shared and studied where the original cannot.</p>
    <p><b>How a run works.</b> ${Object.entries(h.stages||{}).map(([k,v])=>`<a href="#" onclick="helpFor('stage','${k}');return false">${esc(v.title)}</a>`).join(" → ")}.</p>
    <h3 class="sec">Terms</h3><dl>${Object.entries(h.glossary||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <h3 class="sec">Tabs of a run</h3><dl>${tabs}</dl>
    <p class="muted small">More: the docs folder (README, DESIGN, KNOWLEDGE_GRAPH, EXPERIMENTS and the paper sections).</p>`);
}

function md(text){ // tiny markdown: headings + paragraphs
  return text.split(/\n\s*\n/).map(b=>{ b=b.trim(); if(!b) return "";
    const h=b.match(/^(#{1,3})\s+(.*)$/); if(h) return `<h${h[1].length}>${esc(h[2])}</h${h[1].length}>`;
    return `<p>${esc(b).replace(/\n/g,"<br>")}</p>`; }).join("");
}

async function loadExperiments(){
  try{ const xs = (await api("/api/experiments")).filter(x=>x.has_report);
    $("#exps").innerHTML = xs.length? `<div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Experiments</div>` + xs.map(x=>`<a class="small-link" href="#" onclick="showExperiment('${esc(x.name)}');return false" style="display:block;font-size:13px;padding:3px 0">${esc(x.name)} <span class="muted">· ${x.jobs} runs</span></a>`).join("") : "";
  }catch(e){}
}
async function showExperiment(name){
  const xs = await api("/api/experiments"); const x = xs.find(e=>e.name===name);
  if(!x){ toast("experiment not found"); return; }
  CUR=null; closeES(); loadRuns();
  const folder = x.path.split(/[\\/]/).pop();
  $("main").innerHTML = `<div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="font:600 22px var(--serif);margin:0">Experiment: ${esc(x.name)}</h2>
    <a class="small-link" target="_blank" href="/experiments/${encodeURIComponent(folder)}/report.html"><button class="small">Open in a new tab</button></a></div>
    <p class="muted">${x.jobs} runs${x.failed?`, ${x.failed} failed`:""}. Corpus level: for every property, the distribution across books on the originals and on the synthetic texts, each book's pair joined by a line. If the synthetic corpus can stand in for the originals, both rows have the same spread and the lines rarely cross.</p>
    <iframe src="/experiments/${encodeURIComponent(folder)}/report.html" style="width:100%;height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px;background:var(--panel)"></iframe>`;
}
async function loadRuns(){
  const runs = await api("/api/runs");
  // versions made by fixes are listed under the run they come from
  const kids = {}; runs.filter(r=>r.parent).forEach(r=>{ const root=r.root||r.parent; (kids[root]=kids[root]||[]).push(r); });
  const item = (r, child) => `<div class="item ${CUR===r.id?"active":""}" ${child?'style="margin-left:14px;border-left:2px solid var(--line)"':""} onclick="openRun('${r.id}')">
    <div class="t"><span class="dot ${r.executing?"running":r.status}"></span>${child?`version ${r.version}`:esc(presetTitle(r.preset))} · ${esc(r.language||"")}</div>
    <div class="s">${child?esc((r.fix_titles||r.fixes||[]).join(", ")):esc(r.id)}${r.cost_usd?` · $${r.cost_usd.toFixed(3)}`:""}</div></div>`;
  const roots = runs.filter(r=>!r.parent);
  $("#runs").innerHTML = runs.length ? roots.map(r=>item(r,false) + (kids[r.id]||[]).sort((a,b)=>(a.version||0)-(b.version||0)).map(k=>item(k,true)).join("")).join("")
    + runs.filter(r=>r.parent && !roots.some(x=>x.id===(r.root||r.parent))).map(r=>item(r,true)).join("") : `<p class="muted">No runs yet.</p>`;
}

// ------------------------------------------------------------------ new run
let PRESET = "full";
const JUDGES = {psalm: ["PSALM dimensions", "six dimensions × six aspects; function and expression rated separately, with evidence and reasoning (6 calls)"],
  content: ["Same story", "chapter summaries of both texts compared (1 call)"], style: ["Same style", "name-masked excerpts compared (1 call)"]};
function judgePicker(prefix){ return `<div class="stagepick">${Object.entries(JUDGES).map(([k,[l,h]])=>`<label title="${esc(h)}"><input type="checkbox" class="jpick-${prefix}" value="${k}" checked> ${esc(l)}</label>`).join("")}</div>`; }
async function runJudges(){
  const model = ($("#jModelEv")||{}).value||"", instruments=[...document.querySelectorAll(".jpick-ev:checked")].map(x=>x.value);
  if(!instruments.length){ toast("Choose at least one judge."); return; }
  try{ await api(`/api/runs/${CUR}/judge`, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({model, instruments})}); toast("Judges running — only the evaluation is redone."); TAB="activity"; await openRun(CUR); }
  catch(e){ toast(e.message); }
}
function showNew(){
  CUR=null; closeES(); loadRuns();
  const hp = H().presets||{}, kinds = H().kinds||{};
  const byKind = {}; META.presets.forEach(p=>{ const k=(hp[p.name]||{}).kind||"baseline"; (byKind[k]=byKind[k]||[]).push(p); });
  const presetCards = Object.keys(kinds).filter(k=>byKind[k]).map(k=>`<div class="pkind">${esc(kinds[k])}</div><div class="pcards">${byKind[k].map(p=>{ const h=hp[p.name]||{};
      return `<label class="pcard ${p.name===PRESET?"on":""}" data-preset="${p.name}"><input type="radio" name="preset" value="${p.name}" ${p.name===PRESET?"checked":""} onchange="presetChanged('${p.name}')"><b>${esc(h.title||p.name)}${h.recommended?' <span class="core">recommended</span>':""}${info("preset",p.name)}</b><span>${esc(h.summary||p.description)}</span></label>`; }).join("")}</div>`).join("");
  const P = H().policies||{}, EX = H().dimension_examples||{};
  const polRows = META.taxonomy.dimensions.map(d=>`<tr><td><div class="dl">${esc(d.label)}${info("dimension",d.key)}</div><div class="dd">${esc(d.description)}</div></td>
      ${["preserve","abstract","regenerate"].map(o=>`<td class="opt" title="${esc((P[o]||{}).title||o)}: ${esc((EX[d.key]||{})[o]||"")}"><input type="radio" name="pol-${d.key}" value="${o}" data-pol="${d.key}"><div class="dd">${esc((EX[d.key]||{})[o]||"")}</div></td>`).join("")}</tr>`).join("");
  $("#main").innerHTML = `
  <h2 style="font:600 24px var(--serif);margin:0 0 4px">New run</h2>
  <p class="lead">Give a text, choose what to run and what should carry over from the source, and start. You can follow every step live in the run's <b>activity</b> tab.</p>
  <div class="card"><h3>1 · Input</h3>
    <p class="lead">Upload or paste the text. Any language: the synthetic text is written in the language of the input.</p>
    <div class="row"><input type="file" id="file" accept=".txt,.md,.json" style="max-width:320px">
      <label style="margin:0">Kind of input${info("mode")}</label>
      <select id="kind" style="max-width:260px"><option value="auto">decide automatically</option><option value="source">a source text to make a counterpart of</option><option value="premise">a premise for a new story</option><option value="spec">a specification (JSON)</option></select></div>
    <label>…or paste text</label><textarea id="text" rows="7" placeholder="Paste a book, a chapter or a premise."></textarea>
  </div>
  <div class="card"><h3>2 · What to run</h3>
    <p class="lead">A <i>preset</i> is a ready-made pipeline. Use <b>Full pipeline</b> to produce a synthetic text; the others are for testing or for experiments that compare methods.</p>
    <div class="presets">${presetCards}</div>
    <label>Stages in this preset <span class="muted" style="font-weight:400">— hover for what each does; untick to skip one</span></label><div id="stages" class="stagepick"></div>
  </div>
  <div class="card"><h3>3 · What carries over from the source ${info("policy")}</h3>
    <p class="lead">For each dimension: <b>Keep</b> it as in the source, <b>Re-invent</b> it (same function, new particulars) or <b>Replace</b> it freely. Names are always replaced. Only applies when the input is a source text.</p>
    <div class="row" style="margin-bottom:8px"><span class="muted small">Quick choice:</span>
      <button class="small nobusy" onclick="setPolicies('all')">Keep everything</button>
      <button class="small nobusy" onclick="setPolicies('surface')">Keep story and style, new people and world</button>
      <button class="small nobusy" onclick="setPolicies('structure')">Keep only the structure</button></div>
    <table class="pol"><tr><th>dimension</th>${["preserve","abstract","regenerate"].map(o=>`<th class="polhead">${esc((P[o]||{}).title||o)}<small>${esc((P[o]||{}).short||"")}</small></th>`).join("")}</tr>${polRows}</table>
    <div class="row" style="margin-top:10px"><label style="margin:0" title="Replace every character and place name with a new one (recommended: original names are protected expression)."><input type="checkbox" id="rename" checked style="width:auto"> replace all names</label>
    <label style="margin:0" title="New names fit the source's culture and period (Dutch names for a Dutch novel), instead of being free."><input type="checkbox" id="culture" checked style="width:auto"> keep the cultural setting of names</label></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>4 · Model</h3>
      <label>Model <span class="muted" style="font-weight:400">(any LiteLLM model id; leave empty for the preset's) — <a href="#" onclick="showKeys();return false">set API keys</a></span></label><input id="model" placeholder="e.g. anthropic/claude-sonnet-5-5, openai/gpt-5.5, mistral/mistral-large-latest — fake/test runs offline">
      <label>Reasoning effort <span class="muted" style="font-weight:400">(reasoning models only: how much the model thinks before answering — more costs more)</span></label>
      <select id="effort"><option value="">provider default</option><option>low</option><option>medium</option><option>high</option></select>
      <label>Budget in US dollars <span class="muted" style="font-weight:400">(the run stops when it is spent)</span></label><input id="budget" type="number" step="0.5" placeholder="no limit">
    </div>
    <div class="card"><h3>5 · Language and length</h3>
      <div class="grid3"><div><label title="Output language; auto = the input's language">Language</label><input id="lang" placeholder="as input"></div>
        <div><label title="Target length in words; empty = the source's length">Words</label><input id="words" type="number" placeholder="as source"></div>

      <div><label>Judges</label>${judgePicker("j")}</div></div>

    <label>Pause after <span class="muted" style="font-weight:400">(stop to inspect or edit, then resume)</span></label><select id="until"><option value="">run to the end</option><option value="spec">the specification (check it before anything is written)</option><option value="transform">the transform step (check names and design)</option><option value="plan">the plan (check it before drafting)</option></select>
    <label>Extra settings <span class="muted" style="font-weight:400">(one key=value per line; see the config tab of a run for all keys)</span></label><textarea id="extra" rows="2" class="mono" placeholder="stages.review.params.rounds=2&#10;stages.guard.params.min_span=8"></textarea>
  </details>
  <button class="primary" onclick="createRun()">Start run</button>`;
  presetChanged(PRESET);
}
function setPolicies(kind){
  const sets = {all: {}, surface: {character:"abstract", world_building:"abstract"},
    structure: {writing_style:"abstract", narrative_voice:"abstract", character:"abstract", world_building:"abstract"}};
  META.taxonomy.dimensions.forEach(d=>{ const v=(sets[kind]||{})[d.key]||"preserve"; const r=document.querySelector(`input[data-pol="${d.key}"][value="${v}"]`); if(r) r.checked=true; });
}
function presetChanged(name){
  PRESET = name || PRESET;
  document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("on", c.dataset.preset===PRESET));
  const p = META.presets.find(x=>x.name===PRESET);
  const order=["extract","spec","transform","plan","draft","conform","review","guard","assemble","recover","evaluate"];
  $("#stages").innerHTML = order.filter(s=>s in p.config.stages).map(s=>{const c=p.config.stages[s];
    return `<label title="${esc(((H().stages||{})[s]||{}).what||s)}"><input type="checkbox" data-stage="${s}" ${c.enabled?"checked":""}> ${esc(stageTitle(s))}${c.impl&&c.impl!==s?` <span class="muted">(${esc(c.impl)})</span>`:""}</label>`}).join("");
  for(const [k,v] of Object.entries(p.config.transform.policy)){ const r=document.querySelector(`input[data-pol="${k}"][value="${v}"]`); if(r) r.checked=true; }
}
async function createRun(){
  const p = META.presets.find(x=>x.name===PRESET);
  const ov = {};
  document.querySelectorAll("[data-stage]").forEach(c=>{ if(c.checked!==p.config.stages[c.dataset.stage].enabled) ov[`stages.${c.dataset.stage}.enabled`]=c.checked; });
  document.querySelectorAll("input[data-pol]:checked").forEach(r=>{ if(r.value!==p.config.transform.policy[r.dataset.pol]) ov[`transform.policy.${r.dataset.pol}`]=r.value; });
  if(!$("#rename").checked) ov["transform.rename_entities"]=false;
  if(!$("#culture").checked) ov["transform.keep_cultural_setting"]=false;
  if($("#model").value) ov["models.default.name"]=$("#model").value.trim();
  if($("#effort").value) ov["models.default.extra.reasoning_effort"]=$("#effort").value;
  if($("#lang").value) ov["language.output"]=$("#lang").value.trim();
  if($("#variety").value) ov["language.variety"]=$("#variety").value.trim();
  if($("#words").value) ov["length.target_words"]=+$("#words").value;
  if($("#chapters").value) ov["length.chapters"]= isNaN(+$("#chapters").value)? $("#chapters").value : +$("#chapters").value;
  if($("#budget").value) ov["limits.max_cost_usd"]=+$("#budget").value;

function closeES(){ if(ES){ ES.close(); ES=null; } }
async function openRun(id){
  CUR=id; EVENTS=[]; closeES(); await loadRuns(); await renderRun();
  ES = new EventSource(`/api/runs/${id}/events`);
  let pending=null;
  ES.onmessage = m => { const e=JSON.parse(m.data); EVENTS.push(e); if(e.call && (e.type==="llm_call"||e.type==="llm_retry")) delete ACT.calls[e.call]; if(TAB==="activity") ACT.schedule();
    if(e.type==="stage_progress" && e.stage==="recover"){ const b=$("#recoverBtn"); if(b) b.textContent=recoverLabel(); }
    if(["stage_progress","llm_start","llm_call"].includes(e.type)){ const n=$("#nowline"); if(n && window.ST) n.innerHTML = nowLine(window.ST); }
    if(["stage_finished","stage_started","run_finished","run_failed","invalidated"].includes(e.type)){ clearTimeout(pending); pending=setTimeout(()=>{ renderRun(true); loadRuns(); }, 300);} };
  ES.addEventListener("idle", ()=>closeES());
}

function nowLine(st){

      sum = `chapter ${e.chapter} · ${esc(e.action)} ${e.round}: <span class="${e.blocking?"wrn":"ok"}">${e.blocking} blocking</span>${cov}${e.kept!=null?` · <span class="${e.kept?"ok":"wrn"}">${e.kept?"kept":"not kept"}</span>`:""}${e.style!=null?` <span class="adim">· style ${e.style}</span>`:""}`;
      body = (e.issues||[]).map(g=>`<div class="pv">· ${esc(g)}</div>`).join("") || `<div class="pv">no issues</div>`;
    }
    const id = `n${ts}${type}${e.chapter}${e.round}`;
    return `<details class="ln" data-id="${esc(id)}" ${ACT.open.has(id)&&!ACT.closed.has(id)?"open":""}><summary><span class="t">${tm(ts)}</span> <span class="adim">›</span> ${sum}</summary>${body}</details>`;
  }
  if(JSON.stringify(rest).length > 220){
    const id = `n${ts}${type}`; const short = rest.message || type;
    return `<details class="ln" data-id="${esc(id)}" ${ACT.open.has(id)&&!ACT.closed.has(id)?"open":""}><summary><span class="t">${tm(ts)}</span> <span class="${PROBLEM.has(type)?"wrn":"adim"}">${PROBLEM.has(type)?"!":"·"} ${esc(type)} ${esc(String(short).slice(0,160))}</span></summary><pre class="pv">${esc(JSON.stringify(rest, null, 2))}</pre></details>`;
  }
  const cls = type==="run_failed"||type==="stage_failed" ? "err" : PROBLEM.has(type) ? "wrn" : "adim";
  const msg = rest.message || (type==="stage_progress" ? JSON.stringify(rest) : Object.entries(rest).map(([k,v])=>`${k}=${typeof v==="object"?JSON.stringify(v):v}`).join(" "));
  const icon = PROBLEM.has(type) ? "!" : type==="stage_progress" ? "›" : "·";
  return `<div class="ln"><span class="t">${tm(ts)}</span> <span class="${cls}">${icon} ${type==="stage_progress"?"":esc(type)+" "}${esc(String(msg).slice(0,400))}</span></div>`;
}
function groupHTML(g, i, last){
  const id = `g${i}:${g.name}`;
  const st = g.status==="info" ? `<span class="adim">●</span>` : g.status==="done" ? `<span class="ok">✓</span>` : g.status==="failed" ? `<span class="err">✗</span>` : g.status==="skipped" ? `<span class="adim">–</span>` : `<span class="run spin">◐</span>`;
  const secs = g.fin && g.fin.seconds!=null ? g.fin.seconds : ((g.end||Date.now()/1000) - g.start);
  const bits = [`${dur(secs)}`, g.calls?`${g.calls} call${g.calls>1?"s":""}`:"", g.tok?`${kfmt(g.tok)} tok`:"", g.cost?`$${g.cost.toFixed(3)}`:"",
    g.inflight?`<span class="run">${g.inflight} in flight</span>`:"", g.problems?`<span class="wrn">${g.problems} warning${g.problems>1?"s":""}</span>`:""].filter(Boolean).join(" · ");
  let items = ACT.problems ? g.items.filter(it => it.kind==="note" ? PROBLEM.has(it.e.type) : (it.retried || it.lost || (it.res && it.res.finish==="length"))) : g.items;
  if(ACT.q){ const q = ACT.q.toLowerCase(); items = items.filter(it => JSON.stringify(it.res || it.e).toLowerCase().includes(q)); if(!items.length) return ""; }
  // chapters as sub-groups when the stage works on several
  const chs = [...new Set(items.map(chapterOf).filter(x=>x!=null))];
  let body;
  if(chs.length > 1){
    const loose = items.filter(it => chapterOf(it)==null).map(lineHTML).join("");
    body = loose + chs.sort((a,b)=>a-b).map(c => { const its = items.filter(it=>chapterOf(it)===c); const sid = `${id}:ch${c}`;
      const fly = its.filter(it=>it.kind==="call" && !it.done).length, n = its.filter(it=>it.kind==="call").length, pr = its.filter(it=>it.kind==="note" && PROBLEM.has(it.e.type)).length;
      const open = !ACT.closed.has(sid) && (ACT.open.has(sid) || (ACT.follow && fly>0));
      return `<details class="asub" data-id="${esc(sid)}" ${open?"open":""}><summary>${fly?`<span class="run spin">◐</span>`:`<span class="ok">✓</span>`} chapter ${c} <span class="adim">· ${n} call${n!==1?"s":""}${fly?` · ${fly} in flight`:""}</span>${pr?` <span class="wrn">· ${pr} warning${pr>1?"s":""}</span>`:""}</summary>${its.map(lineHTML).join("")}</details>`; }).join("");
  } else body = items.map(lineHTML).join("");
  if(!body) body = `<div class="ln adim">${ACT.problems?"no problems":"nothing logged"}</div>`;
  const open = !ACT.closed.has(id) && (ACT.open.has(id) || (ACT.follow && (g.status==="running" || (last && g.status!=="done"))));
  return `<details class="grp" data-id="${esc(id)}" ${open?"open":""}><summary>${st} ${esc(g.name)} <span class="adim">· ${bits}</span></summary>${body}</details>`;
}
function drawActivity(force){
  const box = $("#act"); if(!box) return;
  // Do not pull the text away while someone reads or selects it; catch up when the pointer leaves.
  const sel = window.getSelection && window.getSelection();
  const selecting = sel && !sel.isCollapsed && box.contains(sel.anchorNode);
  if(!force && !ACT.raw && (box.matches(":hover") || selecting) && box.childElementCount){ ACT.dirty = true; const h = box.querySelector(".head .paused"); if(h) h.textContent = "paused while you read — move the pointer away to update"; return; }
  ACT.dirty = false;
  const keepScroll = box.scrollTop;
  if(ACT.raw){ box.innerHTML = EVENTS.slice(-600).reverse().map(evLine).join(""); box.className = "card"; return; }
  box.className = "term";
  const groups = actModel(EVENTS);
  const calls = groups.reduce((a,g)=>a+g.calls,0), fly = groups.reduce((a,g)=>a+g.inflight,0), cost = groups.reduce((a,g)=>a+g.cost,0), tok = groups.reduce((a,g)=>a+g.tok,0);
  const first = EVENTS.length ? EVENTS[0].ts : null, lastTs = EVENTS.length ? EVENTS[EVENTS.length-1].ts : null;
  const live = ST && ST.executing;
  const head = `<div class="head"><span>${live?`<span class="run spin">◐</span> running`:`<span class="ok">■</span> ${esc(ST?ST.status:"")}`}</span><span class="paused wrn"></span>
    <span>${EVENTS.length} events</span><span>${calls} model calls${fly?` · <span class="run">${fly} in flight</span>`:""}</span><span>${kfmt(tok)} tokens</span><span>$${cost.toFixed(3)}</span>
    ${first?`<span>${tm(first)} → ${live?"now":tm(lastTs)}</span>`:""}</div>`;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = head + (groups.length ? groups.map((g,i)=>groupHTML(g,i,i===groups.length-1)).join("") : `<div class="adim">No events yet. They appear here as the run works.</div>`);
  if(!box.dataset.wired){ box.dataset.wired = "1";  // only the user's clicks count, not re-renders
    box.addEventListener("click", ev => { const sm = ev.target.closest("summary"); if(!sm) return; const d = sm.parentElement, id = d.dataset.id; if(!id) return;
      const willOpen = !d.open; if(willOpen){ ACT.open.add(id); ACT.closed.delete(id); } else { ACT.closed.add(id); ACT.open.delete(id); }
      if(willOpen && id.startsWith("call:")){ ev.preventDefault(); d.open = true; const body = d.querySelector(".pv, .call"); const html = callDetailHTML(id.slice(5)); if(body) body.outerHTML = html; else d.insertAdjacentHTML("beforeend", html); } }); }
  if(ACT.follow && live && !force && atBottom) box.scrollTop = box.scrollHeight; else box.scrollTop = keepScroll;
  if(!box.dataset.leave){ box.dataset.leave = "1"; box.addEventListener("mouseleave", () => { if(ACT.dirty) drawActivity(); }); }
}
async function tabActivity(el){
  if(!EVENTS.length){ const txt = await get("events.jsonl"); if(typeof txt==="string") EVENTS = txt.split("\n").filter(Boolean).map(l=>{ try{return JSON.parse(l)}catch{return null} }).filter(Boolean); }
  const chk = (k, l, t) => `<label class="kg-check" title="${t}"><input type="checkbox" class="nobusy" ${ACT[k]?"checked":""} onchange="ACT.${k}=this.checked;drawActivity()"> ${l}</label>`;
  el.innerHTML = `<div class="row" style="margin-bottom:8px">${chk("follow","follow","keep the running stage open and scroll along")}${chk("problems","only problems","warnings, retries, mismatches and truncated answers")}${chk("raw","raw events","every event as recorded in events.jsonl")}
    <input id="actq" class="nobusy" placeholder="search calls, prompts' previews, warnings…" value="${esc(ACT.q)}" style="max-width:260px" oninput="ACT.q=this.value;drawActivity(true)">
    <span class="grow"></span><span class="muted small">Click a call for its full input, answer and reasoning. Watching does not slow the run.</span></div><div id="act" class="term"></div>`;
  drawActivity();
  clearInterval(ACT.tick); ACT.tick = setInterval(()=>{ if(TAB!=="activity"){ clearInterval(ACT.tick); return; } if(ST && ST.executing) drawActivity(); }, 1000);
}

function dur(x){ if(x==null) return "–"; x=+x; return x<120? x.toFixed(1)+"s" : `${Math.floor(x/60)}m${String(Math.floor(x%60)).padStart(2,"0")}s`; }
// Plain number tile (no grading), used by the usage tab.
function metric(v, l, h=""){ return `<div class="metric"><div class="v">${v??"–"}</div><div class="l">${l}</div>${h?`<div class="h">${h}</div>`:""}</div>`; }
async function tabUsage(el){
  const u = ST.usage||{}, t = ST.timing||{}, by = u.by_stage||{}, tim = t.stages||{};
  const order = ST.stages.map(s=>s.name); const names = [...order.filter(n=>n in by||n in tim), ...Object.keys(by).filter(n=>!order.includes(n))];
  const fmt = n => Math.round(n||0).toLocaleString();
  const tot = names.reduce((a,n)=>a+((by[n]||{}).cost_usd||0),0) || 1;
  el.innerHTML = `<div class="grid3">
      ${metric(dur(t.wall_seconds),"wall clock",`${t.invocations||1} invocation(s), incl. resumes`)}
      ${metric("$"+(u.cost_usd||0).toFixed(3),"cost", u.replayed_cost_usd?`+ $${u.replayed_cost_usd.toFixed(3)} served from cache`:"")}
      ${metric(fmt((u.prompt_tokens||0)+(u.completion_tokens||0)),"tokens",`${fmt(u.prompt_tokens)} in · ${fmt(u.completion_tokens)} out · ${fmt(u.cache_read_tokens)} cache-read`)}</div>
    ${u.unpriced_calls?`<div class="card warn" style="margin-top:14px">${u.unpriced_calls} calls had no known price and are counted as $0. Set <span class="mono">models.&lt;role&gt;.input_cost_per_mtok</span> / <span class="mono">output_cost_per_mtok</span>.</div>`:""}
    <div class="card" style="margin-top:14px"><h3>Per stage</h3><table><tr><th>stage</th><th title="time on the clock, summed over attempts">wall clock</th><th title="how often the stage ran (resumes and redos count)">attempts</th><th>model calls</th><th>input tok</th><th>output tok</th><th>$</th><th>share of cost</th><th>retries</th></tr>
    ${names.map(n=>{const b=by[n]||{}, w=tim[n]||{}; const sh=(b.cost_usd||0)/tot;
      return `<tr><td title="${esc(n)}">${esc(stageTitle(n))}</td><td>${dur(w.wall_seconds)}</td><td>${w.runs??"–"}</td><td>${fmt(b.calls)}</td><td>${fmt(b.prompt_tokens)}</td><td>${fmt(b.completion_tokens)}</td><td>${(b.cost_usd||0).toFixed(4)}</td>
      <td><div style="background:var(--soft);border-radius:3px;height:8px;width:120px"><div style="background:var(--accent);height:8px;border-radius:3px;width:${Math.round(sh*120)}px"></div></div></td><td>${fmt(b.retries)}</td></tr>`}).join("")}</table>
    <p class="muted" style="font-size:12px">Wall clock is cumulative over all attempts of a stage. Model time (${dur(u.llm_seconds)} in total) can exceed wall clock because calls run in parallel.</p></div>`;
}
async function tabConfig(el){ el.innerHTML = `<div class="card"><p class="muted small">Every setting of this run, after the preset and your overrides were combined. Any value can be changed for a new run with a <span class="mono">key=value</span> line under <i>Advanced</i> (e.g. <span class="mono">stages.review.params.rounds=2</span>); keys follow the nesting shown here.</p><pre class="mono" style="white-space:pre-wrap">${esc(JSON.stringify(ST.meta.config,null,2))}</pre></div>`; }

(async()=>{ META = await api("/api/meta"); await loadRuns(); loadExperiments(); const runs = await api("/api/runs"); runs.length? openRun(runs[0].id) : showNew(); setInterval(loadRuns, 8000); })();
</script>
