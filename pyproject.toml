[project]
name = "psalm-saga"
version = "0.1.0"
description = "A spec-first, PSALM-dimension-aligned story-writing agent built on LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "nscharrenberg" }]
dependencies = [
    "deepagents>=0.7.6",
    "jsonpatchkit>=0.1.0",
    "langchain>=1.3.15",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=13.6.0,<15.0.0",
]

[project.urls]
Homepage = "https://github.com/nscharrenberg/psalm-saga"
Issues = "https://github.com/nscharrenberg/psalm-saga/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "psalm-saga[all]",
    "deepeval>=4.1.8",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.5.6",
]
openai = [
    "langchain-openai>=1.5.1",
]
all = ["psalm-saga[anthropic,openai]"]

[project.scripts]
psalm-saga = "psalm_saga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["psalm_saga"]
# `skills/` lives inside the package dir; make sure the non-.py content
# (SKILL.md, references/*.md) ships too.
artifacts = ["psalm_saga/skills/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".runtime/**", "**/_runtime/**", "examples/**", "runs/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "C901",
    "COM812",
    "D203",
    "D102",
    "D213",
    "D107",
    "E501",
    "EM102",
    "ISC001",
    "PERF401",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "Q000",
    "S314",
    "S603",
    "S607",
    "TC001",
    "TC003",
    "TRY003",
    "CPY001",
    "D401",
    "D205"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",
    "ANN201",
    "D",
    "S101",
    "TC002",
    "TC003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
