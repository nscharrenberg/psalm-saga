[project]
name = "psalm-saga"
version = "2.0.0a1"
description = "Dimension-controlled story synthesis: turn (copyrighted) literary sources into synthetic stories that keep their research-relevant data points but not their expression."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nscharrenberg" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.50",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
experiments = ["pandas>=2.0"]
all = ["psalm-saga[web,experiments]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "psalm-saga[all]"]

[project.scripts]
saga = "psalm_saga.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psalm_saga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"psalm_saga/cli/*" = ["B008"]
"psalm_saga/web/*" = ["B008"]
"tests/*" = ["B008"]
