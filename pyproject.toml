[project]
name = "psalm-saga"
version = "0.0.1"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.12",
    "langchain-core>=1.5.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/nscharrenberg/psalm-saga"
Issues = "https://github.com/nscharrenberg/psalm-saga/issues"

[project.scripts]
saga = "psalm_saga.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psalm_saga"]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.5.2",
]
openai = [
    "langchain-openai>=1.4.1",
]
all = ["psalm-saga[anthropic,openai]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
